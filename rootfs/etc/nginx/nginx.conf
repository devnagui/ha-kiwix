worker_processes auto;
error_log /proc/1/fd/2 warn;
pid /tmp/nginx.pid;

# Rewrite Kiwix asset links for both direct access and Home Assistant ingress.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /proc/1/fd/1 main;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10G;  # For large ZIM uploads
    
    # Get ingress path from header (set by Home Assistant)
    # X-Ingress-Path header contains the base path like "/632709b9_kiwix/ingress"
    map $http_x_ingress_path $ingress_path_from_header {
        default "";
        ~^(?<path>.*)$ $path;
    }
    
    # Extract ingress path from request URI if present
    # Home Assistant uses pattern: /api/hassio_ingress/<session_token>/...
    # Old pattern: /<addon_id>/ingress/...
    map $request_uri $ingress_path_from_uri {
        default "";
        # Match Home Assistant ingress pattern first
        ~^(?<path>/api/hassio_ingress/[^/]+) $path;
        # Fallback to old pattern
        ~^(?<path>/[^/]+/ingress) $path;
    }
    
    # Use URI-based ingress path if header is not available
    map "$ingress_path_from_header:$ingress_path_from_uri" $ingress_path {
        default $ingress_path_from_uri;
        ~^[^:]+: $ingress_path_from_header;
    }

    map $ingress_path $kiwix_public_prefix {
        default "$ingress_path/wiki";
        "" "";
    }

    map $ingress_path $viewer_redirect_path {
        default "$ingress_path/wiki/viewer";
        "" "/wiki/viewer";
    }
    
    server {
        listen 8111;
        server_name _;
        absolute_redirect off;
        
        # Landing page with tabs - handle both root and ingress paths
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }
        
        # Handle ingress root path
        # Home Assistant uses: /api/hassio_ingress/<token>/
        # Old pattern: /632709b9_kiwix/ingress/
        location ~ ^/(api/hassio_ingress/[^/]+|[^/]+/ingress)/?$ {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }
        
        # Redirect /viewer to /wiki/viewer to preserve path context
        # Handle both direct and ingress paths (Home Assistant and old patterns)
        location ~ ^(?:/(api/hassio_ingress/[^/]+|[^/]+/ingress))?/viewer$ {
            return 302 $viewer_redirect_path$is_args$args;
        }

        # Route catalog requests through a text-only filter location.
        location ~ ^/api/hassio_ingress/[^/]+/wiki(/catalog(?:/|$).*) {
            rewrite ^/api/hassio_ingress/[^/]+/wiki(/catalog(?:/|$).*) $1 last;
        }

        location ~ ^(?:/[^/]+/ingress)?/wiki(/catalog(?:/|$).*) {
            rewrite ^(?:/[^/]+/ingress)?/wiki(/catalog(?:/|$).*) $1 last;
        }

        location ~ ^/(api/hassio_ingress/[^/]+|[^/]+/ingress)(/catalog(?:/|$).*) {
            rewrite ^/(?:api/hassio_ingress/[^/]+|[^/]+/ingress)(/catalog(?:/|$).*) $1 last;
        }

        # Catalogue illustrations are binary and must never pass through sub_filter.
        location ~ ^/catalog/v2/illustration/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }

        location ~ ^/catalog(?:/|$) {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            proxy_redirect ~^(/.*)$ $kiwix_public_prefix$1;
            sub_filter_once off;
            sub_filter_types *;
            sub_filter 'href="/' 'href="$kiwix_public_prefix/';
            sub_filter 'src="/' 'src="$kiwix_public_prefix/';
            sub_filter 'action="/' 'action="$kiwix_public_prefix/';
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }
        
        # Home Assistant strips the ingress prefix before forwarding these requests.
        location ~ ^/(skin|search|suggest|content|zim|library|meta|nojs)(?:/|$) {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            proxy_redirect ~^(/.*)$ $kiwix_public_prefix$1;
            sub_filter_once off;
            sub_filter 'href="/' 'href="$kiwix_public_prefix/';
            sub_filter 'src="/' 'src="$kiwix_public_prefix/';
            sub_filter 'action="/' 'action="$kiwix_public_prefix/';
            sub_filter '?cacheid=' '?ha_kiwix=209&cacheid=';
            
            # Timeouts for large file transfers
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }
        
        # Kiwix API endpoints WITH ingress prefix
        location ~ ^/(api/hassio_ingress/[^/]+|[^/]+/ingress)/(skin|search|suggest|content|zim|library|meta|nojs)(?:/|$) {
            # Remove ingress path prefix
            rewrite ^(?:/(api/hassio_ingress/[^/]+|[^/]+/ingress))?/(.*)$ /$2 break;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $ingress_path;
            proxy_set_header Accept-Encoding "";
            proxy_redirect ~^(/.*)$ $kiwix_public_prefix$1;
            sub_filter_once off;
            sub_filter 'href="/' 'href="$kiwix_public_prefix/';
            sub_filter 'src="/' 'src="$kiwix_public_prefix/';
            sub_filter 'action="/' 'action="$kiwix_public_prefix/';
            sub_filter '?cacheid=' '?ha_kiwix=209&cacheid=';
            
            # Timeouts for large file transfers
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }
        
        # Kiwix server - Home Assistant ingress pattern
        location ~ ^/api/hassio_ingress/([^/]+)/wiki/ {
            set $ingress_token $1;
            set $ingress_prefix "/api/hassio_ingress/$1";
            
            # Remove ingress path and /wiki prefix for backend
            rewrite ^/api/hassio_ingress/[^/]+/wiki/?(.*)$ /$1 break;
            
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $ingress_prefix;
            proxy_set_header Accept-Encoding "";
            proxy_redirect ~^(/.*)$ $kiwix_public_prefix$1;
            sub_filter_once off;
            sub_filter 'href="/' 'href="$kiwix_public_prefix/';
            sub_filter 'src="/' 'src="$kiwix_public_prefix/';
            sub_filter 'action="/' 'action="$kiwix_public_prefix/';
            sub_filter '<link type="root" href="">' '<link type="root" href="$kiwix_public_prefix">';
            sub_filter '?cacheid=' '?ha_kiwix=209&cacheid=';
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts for large file transfers
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }
        
        # Kiwix server - direct access and old ingress pattern
        location ~ ^(?:/([^/]+)/ingress)?/wiki/ {
            # Remove ingress path and /wiki prefix for backend
            rewrite ^(?:/[^/]+/ingress)?/wiki/?(.*)$ /$1 break;
            
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $ingress_path;
            proxy_set_header Accept-Encoding "";
            proxy_redirect ~^(/.*)$ $kiwix_public_prefix$1;
            sub_filter_once off;
            sub_filter 'href="/' 'href="$kiwix_public_prefix/';
            sub_filter 'src="/' 'src="$kiwix_public_prefix/';
            sub_filter 'action="/' 'action="$kiwix_public_prefix/';
            sub_filter '<link type="root" href="">' '<link type="root" href="$kiwix_public_prefix">';
            sub_filter '?cacheid=' '?ha_kiwix=209&cacheid=';
            
            # Buffer settings for sub_filter to work
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # WebSocket support (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts for large file transfers
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }
        
        # Management API endpoints (must come before /manage/ to catch API calls)
        # Handle both direct paths and ingress paths (Home Assistant and old patterns)
        location ~ ^(?:/(api/hassio_ingress/[^/]+|[^/]+/ingress))?/api/ {
            # Remove ingress path prefix if present (but keep /api/ prefix for this endpoint)
            rewrite ^(?:/(api/hassio_ingress/[^/]+|[^/]+/ingress))?(/api/.*)$ $2 break;
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $ingress_path;
            
            # For file uploads
            client_max_body_size 10G;
            
            # Timeouts for large uploads
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
        }
        
        # Management API - handle both /manage/ and /<ingress>/manage/ paths (Home Assistant and old patterns)
        location ~ ^(?:/(api/hassio_ingress/[^/]+|[^/]+/ingress))?/manage/ {
            # Remove ingress path and /manage prefix for backend
            rewrite ^(?:/(api/hassio_ingress/[^/]+|[^/]+/ingress))?/manage/?(.*)$ /$2 break;
            
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $ingress_path;
            
            # For file uploads
            client_max_body_size 10G;
            
            # Timeouts for large uploads
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
        }
        
        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
