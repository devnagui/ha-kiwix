configuration:
  zim_storage_path:
    name: ZIM Storage Path
    description: >-
      Existing readable and writable directory containing the ZIM library.
      Default is "/media/torrent_disk/project-nomad/storage/zim".
  log_level:
    name: Log Level
    description: >-
      Set the logging verbosity level.
      'debug' provides the most detailed logs, 'error' the least.
  max_upload_size:
    name: Maximum Upload Size (MB)
    description: >-
      Maximum size for uploaded ZIM files in megabytes.
      Default is 10000 (10 GB).
  enable_management:
    name: Enable Management Interface
    description: >-
      Enable the web-based management interface for downloading, uploading, and managing ZIM files.
      Set to false to run only the read-only Kiwix library.
