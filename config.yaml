name: "Kiwix"
description: "Serve an offline ZIM library with Kiwix"
version: "2.1.0"
slug: "naguimar_kiwix"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: manual
protected: true
host_network: false
privileged: []
ports:
  8111/tcp: 8111
ports_description:
  8111/tcp: "Kiwix web interface"
webui: "http://[HOST]:[PORT:8111]/"
map:
  - media:rw
options:
  zim_storage_path: "/media/torrent_disk/project-nomad/storage/zim"
  max_upload_size: 10000
  enable_management: true
  log_level: "info"
schema:
  zim_storage_path: "str"
  max_upload_size: "int(1,)"
  enable_management: "bool"
  log_level: "list(debug|info|warning|error)"
ingress: true
ingress_port: 8111
ingress_entry: "/"
ingress_stream: true
panel_icon: mdi:book-open-variant
panel_title: "Kiwix"
panel_admin: false
