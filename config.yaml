name: "Naguimar Kiwix"
description: "Serve an isolated USB-backed ZIM library on Naguimar"
version: "2.0.7"
slug: "naguimar_kiwix"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: manual
hassio_api: true
hassio_role: default
host_network: false
privileged: []
# Port mapping: Exposes container ports to host
# Format: container_port/tcp: host_port
# Only nginx port is exposed - it handles both Kiwix (/wiki/) and Management (/manage/)
ports:
  8111/tcp: 8111
ports_description:
  8111/tcp: "Nginx reverse proxy (Kiwix + Management)"
webui: "http://[HOST]:[PORT:8111]/wiki/"
map:
  - config:rw
  - ssl:ro
  - data:rw
  - media:rw
options:
  port: 8111
  zim_storage_path: "/media/torrent_disk/project-nomad/kiwix-test"
  log_level: "info"
  max_upload_size: 10000
  enable_management: true
schema:
  port: "port"
  zim_storage_path: "str"
  log_level: "list(debug|info|warning|error)"
  max_upload_size: "int(1,)"
  enable_management: "bool"
ingress: true
ingress_port: 8111
ingress_entry: "wiki/"
# IMPORTANT: ingress_port is static and must match the default 'port' value (8111)
# Ingress only works with the default port. If you change 'port' in options,
# use direct network access instead of ingress (http://homeassistant-ip:PORT)
panel_icon: mdi:book-open-variant
panel_title: "Kiwix"
